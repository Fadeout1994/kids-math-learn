<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孩子数学学习规划 · 幼儿园到高中</title>
<style>
  :root{
    --bg:#faf7f2; --ink:#2b2b33; --ink2:#6b6b76; --line:#ece6dc;
    --card:#ffffff; --coral:#e8734a; --teal:#0f8b8b;
    --kg:#f2994a; --p12:#e6b325; --p34:#57a773; --p56:#12a594;
    --mid:#2f80ed; --high:#8e44c7; --app:#7a7a85;
    --radius:14px; --shadow:0 2px 10px rgba(60,50,40,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px}
  .wrap{max-width:1080px;margin:0 auto;
    padding-left:max(clamp(14px,3vw,28px),env(safe-area-inset-left));
    padding-right:max(clamp(14px,3vw,28px),env(safe-area-inset-right))}

  /* ===== Hero ===== */
  .hero{background:linear-gradient(135deg,#fff4ec 0%,#fdeee4 45%,#f3ecfd 100%);
    border-bottom:1px solid var(--line);text-align:center;
    padding:clamp(28px,6vw,52px) max(18px,env(safe-area-inset-right)) clamp(18px,4vw,30px) max(18px,env(safe-area-inset-left))}
  .hero h1{font-size:clamp(24px,5vw,38px);letter-spacing:1px}
  .hero .sub{color:var(--ink2);margin-top:10px;font-size:clamp(13.5px,3.4vw,15.5px)}
  .hero .tags{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .hero .tags span{background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:3px 14px;font-size:13px;color:var(--ink2)}
  .progress-zone{max-width:560px;margin:22px auto 0;text-align:left}
  .progress-zone .plabel{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:5px}
  .pbar{height:10px;background:#eee4d8;border-radius:999px;overflow:hidden}
  .pbar>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--coral),var(--p56),var(--mid),var(--high));
    transition:width .4s ease}
  .progress-zone .reset{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:12px;text-decoration:underline}
  .progress-zone .reset:hover{color:var(--coral)}

  /* ===== Tabs ===== */
  .tabs{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.96);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs-inner{display:flex;gap:6px;min-width:max-content;justify-content:center;
    padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 18px;cursor:pointer;
    font-size:14px;color:var(--ink2);white-space:nowrap;transition:all .2s;font-family:inherit;
    min-height:40px;display:inline-flex;align-items:center}
  .tab:hover{border-color:#d8cfc0;color:var(--ink)}
  .tab.active{color:#fff;border-color:transparent;font-weight:600}

  /* ===== Panels ===== */
  main{padding:clamp(20px,4vw,32px) 0 clamp(42px,7vw,64px)}
  .panel{display:none;animation:fade .35s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .stage-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .stage-dot{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:20px;flex:none;box-shadow:var(--shadow)}
  .stage-head h2{font-size:clamp(20px,4.8vw,26px)}
  .stage-head .age{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 12px;
    font-size:13px;color:var(--ink2)}
  .lead{color:var(--ink2);margin:10px 0 22px;font-size:15px}
  .lead b{color:var(--ink)}

  .sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:clamp(15px,3.5vw,22px) clamp(15px,3.8vw,24px);
    margin-bottom:clamp(14px,2.5vw,18px)}
  .sec h3{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:12px;flex-wrap:wrap}
  .badge{font-size:12px;font-weight:600;color:#fff;border-radius:6px;padding:2px 9px;letter-spacing:1px}
  .b-key{background:var(--coral)} .b-warn{background:#d9534f} .b-tip{background:var(--teal)}
  .b-goal{background:var(--mid)} .b-link{background:var(--high)} .b-info{background:var(--app)}

  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);
    background:linear-gradient(to right,#fff 30%,rgba(255,255,255,0)),
      linear-gradient(to left,#fff 30%,rgba(255,255,255,0)),
      linear-gradient(to right,rgba(60,50,40,.10),rgba(60,50,40,0)),
      linear-gradient(to left,rgba(60,50,40,.10),rgba(60,50,40,0));
    background-position:left center,right center,left center,right center;
    background-repeat:no-repeat;
    background-size:36px 100%,36px 100%,12px 100%,12px 100%;
    background-attachment:local,local,scroll,scroll}
  table{width:100%;border-collapse:collapse;font-size:clamp(13px,3.6vw,14.5px);min-width:560px}
  th{background:color-mix(in srgb,var(--sc,#888) 10%,#fff);text-align:left;
    padding:clamp(7px,1.9vw,10px) clamp(9px,2.4vw,14px);
    border-bottom:2px solid color-mix(in srgb,var(--sc,#888) 35%,#fff);font-size:.97em;white-space:nowrap}
  td{padding:clamp(7px,1.9vw,10px) clamp(9px,2.4vw,14px);border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td:first-child{font-weight:600;white-space:nowrap;color:color-mix(in srgb,var(--sc,#555) 80%,#222)}

  .items{list-style:none;display:flex;flex-direction:column;gap:9px}
  .items li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
  .items li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc,#aaa);
    margin-top:9px;flex:none}
  .warn-list li::before{background:#d9534f;border-radius:2px}
  .warn-list li{background:#fdf3f2;border-radius:8px;padding:7px 12px}

  /* 打卡 */
  .check{display:flex;gap:12px;align-items:flex-start;background:#fbfaf7;border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
  .check:hover{border-color:var(--sc,#bbb)}
  .check input{display:none}
  .box{width:21px;height:21px;border:2px solid #cfc7ba;border-radius:6px;flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
  .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0;transform:scale(.4);transition:all .2s}
  .check.done{background:color-mix(in srgb,var(--sc,#888) 7%,#fff);border-color:color-mix(in srgb,var(--sc,#888) 45%,#fff)}
  .check.done .box{background:var(--sc,#888);border-color:var(--sc,#888)}
  .check.done .box svg{opacity:1;transform:scale(1)}
  .check.done .txt{color:var(--ink2);text-decoration:line-through;text-decoration-color:#bbb}
  .mini-progress{margin:4px 0 14px;font-size:13px;color:var(--ink2)}
  .mini-progress b{color:var(--sc,#666)}

  .box-callout{background:linear-gradient(135deg,#f6f0ff,#fdf3ee);border:1px solid #e6dcf5}
  .box-callout h3 .badge{background:var(--high)}
  .box-callout ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .box-callout li{padding-left:20px;position:relative;font-size:15px}
  .box-callout li::before{content:"➜";position:absolute;left:0;color:var(--high)}

  /* ===== 书单卡片 ===== */
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
  .book{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .book:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,50,40,.12)}
  .book .cov{width:82px;flex:none}
  .book .cov img{width:82px;height:118px;object-fit:cover;border-radius:4px;
    box-shadow:0 3px 8px rgba(0,0,0,.18);display:block}
  .cover-ph{width:82px;height:118px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--sc,#999),color-mix(in srgb,var(--sc,#777) 55%,#333));
    color:#fff;font-size:11px;padding:6px;text-align:center;line-height:1.5}
  .book .info{flex:1;min-width:0}
  .book .info h4{font-size:15px;line-height:1.5}
  .book .meta{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .book .intro{font-size:13.5px;color:#45454f;margin-top:7px;line-height:1.75}
  .book .fit{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;margin-top:8px;
    background:color-mix(in srgb,var(--sc,#888) 12%,#fff);color:color-mix(in srgb,var(--sc,#555) 85%,#222)}
  .book .buy{display:inline-block;margin-left:10px;margin-top:8px;font-size:12.5px;font-weight:600;
    color:var(--sc,#c0563a);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .book .buy:hover{filter:brightness(1.15)}

  /* ===== 总览 ===== */
  .notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;margin-bottom:20px}
  .note{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .note h4{font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .note p{font-size:14px;color:var(--ink2)}
  .howto{counter-reset:s}
  .howto li{list-style:none;display:flex;gap:12px;margin-bottom:10px;font-size:14.5px}
  .howto li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;
    background:var(--coral);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}

  /* 主线 */
  .lines{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .line .lname{font-weight:700;flex:none;width:86px;font-size:15px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13.5px;box-shadow:var(--shadow)}
  .arrow{color:#c4b9a8;flex:none}

  /* 阶梯 */
  .stairs{display:flex;align-items:flex-end;gap:8px;margin:26px 0 8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;
    background:linear-gradient(to right,#fff 30%,rgba(255,255,255,0)),
      linear-gradient(to left,#fff 30%,rgba(255,255,255,0)),
      linear-gradient(to right,rgba(60,50,40,.10),rgba(60,50,40,0)),
      linear-gradient(to left,rgba(60,50,40,.10),rgba(60,50,40,0));
    background-position:left center,right center,left center,right center;
    background-repeat:no-repeat;
    background-size:36px 100%,36px 100%,12px 100%,12px 100%;
    background-attachment:local,local,scroll,scroll}
  .step{flex:1;min-width:104px;border-radius:12px 12px 0 0;color:#fff;cursor:pointer;border:none;
    padding:12px 10px;line-height:1.4;font-family:inherit;text-align:left;transition:transform .2s,filter .2s;position:relative}
  .step:hover{transform:translateY(-6px);filter:brightness(1.06)}
  .step .t{font-weight:700;font-size:15px;display:block}
  .step .k{font-size:12px;opacity:.92;display:block;margin-top:5px;line-height:1.5}
  .stairs-hint{font-size:12.5px;color:var(--ink2);margin-bottom:20px}

  /* 附录 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .fbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 15px;font-size:13.5px;
    cursor:pointer;color:var(--ink2);font-family:inherit;transition:all .15s;
    min-height:36px;display:inline-flex;align-items:center}
  .fbtn:hover{border-color:#c9bfb0}
  .fbtn.active{background:var(--coral);border-color:var(--coral);color:#fff}
  .search{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:10px;font-size:16px;
    font-family:inherit;margin-bottom:14px;background:#fff}
  .search:focus{outline:2px solid color-mix(in srgb,var(--coral) 45%,#fff)}
  .pitfall{display:none}
  .pitfall.show{display:flex}
  .no-result{text-align:center;color:var(--ink2);padding:24px 0;font-size:14px;display:none}
  mark{background:#ffe9a8;border-radius:3px;padding:0 2px}
  .adv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
  .adv .n{position:absolute;top:14px;right:16px;font-size:26px;font-weight:800;color:#f3ece1;font-family:Georgia,serif}

  /* ===== 附录 D 例题演练 ===== */
  .ex-intro{font-size:13.5px;color:var(--ink2);margin-bottom:8px}
  .ex-item{border-top:1px dashed var(--line);padding:13px 0}
  .ex-item:first-child{border-top:none;padding-top:2px}
  .ex-item:last-child{padding-bottom:2px}
  .ex-item h4{font-size:15px;margin-bottom:4px}
  .ex-item h4 .ex-point{font-size:12px;font-weight:400;color:var(--ink2);margin-left:8px}
  .ex-q{font-size:14.5px;margin-top:9px}
  .ex-q b{color:var(--sc,#888);margin-right:6px;font-size:13px}
  .ex-use{font-size:13.5px;color:var(--ink2);margin:3px 0 5px}
  .ex-ans{font-size:13.5px}
  .ex-ans summary{cursor:pointer;color:var(--coral);font-size:13px;list-style:none;
    display:inline-flex;align-items:center;gap:5px;user-select:none;min-height:30px}
  .ex-ans summary::-webkit-details-marker{display:none}
  .ex-ans summary::before{content:"▶";font-size:10px;transition:transform .15s}
  .ex-ans[open] summary::before{transform:rotate(90deg)}
  .ex-ans .ans-body{margin-top:2px;display:inline-block;background:#fbfaf7;border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;font-size:14px}

  .back-top{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:50%;border:none;
    background:var(--ink);color:#fff;font-size:18px;cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .25s;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:60}
  .back-top.show{opacity:.85;pointer-events:auto}
  .back-top:hover{opacity:1}

  footer{border-top:1px solid var(--line);text-align:center;color:var(--ink2);font-size:13px;line-height:2;
    padding:26px max(18px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  .print-btn{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 18px;cursor:pointer;
    font-family:inherit;font-size:13px;color:var(--ink2);margin-bottom:12px}
  .print-btn:hover{border-color:var(--coral);color:var(--coral)}

  /* ===== 响应式 · 平板竖屏 ===== */
  @media (max-width:900px){
    .hero h1{letter-spacing:.5px}
    .stage-dot{width:42px;height:42px;font-size:18px}
  }

  /* ===== 响应式 · 大屏手机 ===== */
  @media (max-width:640px){
    .stage-dot{width:38px;height:38px;font-size:16px}
    .stage-head{gap:10px}
    .line .lname{width:100%}
    .lead{font-size:14px;margin-bottom:18px}
    .tabs-inner{padding:8px 10px}
    .tab{min-height:38px;padding:5px 14px;font-size:13.5px}
    .hero .tags{gap:6px}
    .hero .tags span{font-size:12px;padding:3px 11px}
    .check{padding:11px 12px}
    .book-grid{gap:10px}
    .adv .n{font-size:22px}
    .back-top{width:40px;height:40px;font-size:16px}
  }

  /* ===== 响应式 · 小屏手机 ===== */
  @media (max-width:420px){
    .book{gap:10px;padding:12px}
    .book .cov{width:68px}
    .book .cov img,.cover-ph{width:68px;height:98px}
    .adv .n{top:10px;right:12px;font-size:20px}
  }

  /* ===== 横屏手机：压缩头部高度 ===== */
  @media (max-height:480px) and (orientation:landscape){
    .hero{padding-top:16px;padding-bottom:12px}
    .hero .tags{margin-top:8px}
    .progress-zone{margin-top:12px}
    .tabs-inner{padding-top:6px;padding-bottom:6px}
  }

  /* ===== 触屏设备：取消悬浮位移 ===== */
  @media (hover:none){
    .book:hover{transform:none}
    .step:hover{transform:none}
  }

  /* ===== 用户偏好：减少动画 ===== */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  @media print{
    .tabs,.back-top,.print-btn,.hero .reset{display:none!important}
    .panel{display:block!important;page-break-before:always}
    .panel:first-of-type{page-break-before:auto}
    body{background:#fff;font-size:12px}
    .sec{box-shadow:none;break-inside:avoid}
    .table-wrap,.stairs{background:none}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>孩子数学学习规划</h1>
    <p class="sub">幼儿园 → 小学 → 初中 → 高中 · 家长用的十二年数学路线图</p>
    <div class="tags">
      <span>对齐 2022 义务教育课标</span><span>对齐 2017 高中课标</span><span>含通用规律标注</span>
    </div>
    <div class="progress-zone">
      <div class="plabel">
        <span>重点知识打卡进度（勾选各学段「重点」自动累计）</span>
        <button class="reset" id="resetBtn" title="清除本机保存的打卡记录">重置</button>
      </div>
      <div class="pbar"><i id="pbarFill"></i></div>
      <div class="plabel" style="margin-top:4px"><span id="pbarText">0 / 0</span><span id="pbarPct">0%</span></div>
    </div>
  </div>
</header>

<nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>

<main class="wrap" id="main"></main>

<button class="back-top" id="backTop" title="回到顶部">↑</button>

<footer>
  <button class="print-btn" onclick="window.print()">🖨 打印本页（自动展开全部内容）</button>
  <div>依据 2022 版《义务教育数学课程标准》、2017 版《普通高中数学课程标准》组织，并结合儿童数学能力发展的一般规律编写。</div>
  <div>各学段内容与学校教学进度如有出入，以学校教材和教师要求为准 · 打卡数据仅保存在本机浏览器</div>
</footer>

<script>
/* ================= 数据（源自《孩子数学学习规划.md》） ================= */
const STAGES = [
{
  id:'overview', tab:'总览', color:'#e8734a', dot:'览', age:'使用说明', noCheck:true,
  lead:'先建立整体认识，再按孩子当前学段细读。点击素养阶梯可直达各学段。',
  sections:[
    {kind:'custom', html:`
      <div class="notes">
        <div class="note"><h4>📐 课标依据 · 小学初中</h4>
          <p>执行 <b>2022 版《义务教育数学课程标准》</b>，四个学段：1~2 年级、3~4 年级、5~6 年级、7~9 年级（初中）。课程目标围绕"三会"：会用数学的眼光观察现实世界、会用数学的思维思考现实世界、会用数学的语言表达现实世界。</p></div>
        <div class="note"><h4>🎓 课标依据 · 高中</h4>
          <p>执行 <b>2017 版《普通高中数学课程标准》（2020 年修订）</b>，课程分必修、选择性必修、选修；核心素养六要素：数学抽象、逻辑推理、数学建模、直观想象、数学运算、数据分析。</p></div>
      </div>`},
    {kind:'custom', title:'总览表', badge:['b-info','总览'], html:`
      <div class="table-wrap" style="--sc:#e8734a"><table>
        <tr><th>阶段</th><th>领域主线</th><th>思维发展主线</th><th>核心素养关键词</th></tr>

    {kind:'custom', title:'附录 C · 给家长的通用建议', badge:['b-tip','建议'], html:`
      <div class="adv">
        <div class="note" style="position:relative"><span class="n">1</span><h4>课内优先，循序渐进</h4>
          <p>超前学只能带来短期优势，理解深度和习惯才决定长期走势；学有余力再考虑拓展（如小学高年级奥数、初中竞赛），且以"兴趣+思维训练"为目的而非证书。</p></div>
        <div class="note" style="position:relative"><span class="n">2</span><h4>盯习惯胜过盯分数</h4>
          <p>书写工整、草稿分区、做完检查、错题及时订正——这四个习惯比多刷一本练习册重要得多。</p></div>
        <div class="note" style="position:relative"><span class="n">3</span><h4>让孩子"讲出来"</h4>
          <p>能讲清楚一道题为什么这么做，才是真懂了。家长的角色是当"学生"，不是当"老师"。</p></div>
        <div class="note" style="position:relative"><span class="n">4</span><h4>关注衔接节点</h4>
          <p>幼升小（数的分合）、三四年级（分数概念，第一道分水岭）、五六年级（算术→代数）、初二（函数与几何证明，第二道分水岭）、高一（抽象度跃升）。节点上的卡顿越早发现越好补——详细时间表与家长行动指南见「节点·危险期」页。</p></div>
        <div class="note" style="position:relative"><span class="n">5</span><h4>警惕"假熟练"</h4>
          <p>计算靠刷出来的速度掩盖不了概念理解的空洞；偶尔让孩子做一道"说一说理由"的开放题，看看思维成色。</p></div>
        <div class="note" style="position:relative"><span class="n">6</span><h4>数学焦虑会传染</h4>
          <p>家长自己对数学的负面情绪尽量少传递给孩子，多展示"数学有用、有趣"的一面。</p></div>
      </div>`},

        {q:'半径 3、圆心角 2 弧度的扇形，面积是多少？', use:'先求弧长 l=|α|·r=2×3=6，再当三角形 S=½lR=½×6×3=9', ans:'9'},
      ]},
      {name:'墙角模型', point:'外接球', ex:[
        {q:'三条棱两两垂直、长度分别为 1、2、2 的三棱锥，外接球半径是多少？', use:'补成长方体：2R=√(1²+2²+2²)=√9=3', ans:'R = 3/2'},
        {q:'长方体长、宽、高为 2、3、6，外接球直径是多少？', use:'直径=体对角线：√(2²+3²+6²)=√49=7', ans:'直径 7'},
      ]},
      {name:'正难则反', point:'概率', ex:[
        {q:'袋中 3 红球 2 白球，不放回摸 2 个，求"至少一个红球"的概率', use:'正难则反：1-P（两个都白）=1-(2/5×1/4)=1-1/10=9/10', ans:'9/10'},
        {q:'同样的袋子，改为放回摸 2 次，"至少一个红球"的概率？', use:'放回分母两世界：P（两次都白）=(2/5)²=4/25，1-4/25=21/25', ans:'21/25'},
      ]},
      {name:'π 谐音', point:'彩蛋：圆周率前几位', ex:[
        {q:'"山巅一寺一壶酒"对应 π 的前几位？', use:'谐音直译：山(3)巅(1)一(1)寺(4)一(1)壶(5)酒(9)', ans:'3.14159'},
        {q:'接上句"尔乐苦煞吾"（2 6 5 3 5），写出 π 的前 10 位', use:'两段拼接：3.14159 接上 26535', ans:'3.1415926535'},
      ]},
      {name:'两边一对角', point:'解三角形正弦定理多解', ex:[
        {q:'△ABC 中 a=2、b=2√2、A=30°，求 B', use:'正弦定理 sinB = b·sinA/a = 2√2×0.5/2 = √2/2 → B=45° 或 135°；两个都能与 A=30° 相加小于 180°（45+30=75、135+30=165）✓；又 b>a 所以 B>A，两解都成立', ans:'B = 45° 或 135°（两解）'},
        {q:'△ABC 中 a=√2、b=√3、B=60°，求 A', use:'正弦定理 sinA = a·sinB/b = √2×(√3/2)/√3 = √2/2 → A=45° 或 135°；因为 a<b 所以 A<B=60°，135° 不满足，舍去', ans:'A = 45°（只有一解——这就是"多解要挑"的典型）'},
      ]},
    ]},
  ]
},
];

/* 附录 B 易错点数据 */
const PITFALLS = [
  ['kg','幼儿园','点数与说总数脱节；左右方位以自己为参照'],
  ['p12','小学低年级','进退位漏 1；口诀记混；元角分换算；接近整点的钟面；有余数除法中余数比除数大；万以内数读写中间末尾的 0'],
  ['p34','小学中年级','试商调商；"平均分"概念缺失；周长面积混淆；平年闰年判断（整百年份需能被 400 整除）；面积单位进率'],
  ['p56','小学高年级','单位"1"判断；比例尺单位统一；圆柱圆锥 3 倍关系的前提（等底等高）；数对先列后行写反；容积与体积单位混用'],
  ['mid','初中','移项不变号；不等式乘除负数不变号；分式方程漏验根；函数自变量范围；几何证明跳步；尺规作图漏作图痕迹；科学记数法指数数错'],
  ['high','高中','忽略定义域；对数条件丢失；圆锥曲线漏判别式；分类讨论遗漏；概率"放回/不放回"混淆；解三角形正弦定理多解漏解'],
];
const PITFALL_LABEL = {kg:'幼儿园',p12:'小学低',p34:'小学中',p56:'小学高',mid:'初中',high:'高中'};

/* ================= 渲染 ================= */
const LS_KEY='mathPlanProgress.v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){progress={}}
const save=()=>localStorage.setItem(LS_KEY,JSON.stringify(progress));

/* Tabs */
const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');
STAGES.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='tab'; b.textContent=s.tab; b.dataset.id=s.id;
  b.style.setProperty('--tc',s.color);
  b.onclick=()=>activate(s.id);
  tabsEl.appendChild(b);
  const p=document.createElement('section');
  p.className='panel'; p.id='panel-'+s.id; p.style.setProperty('--sc',s.color);
  p.innerHTML=renderStage(s);
  mainEl.appendChild(p);
});

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* 表格单元格：支持 {t:'文字',href:'https://...'} 渲染为链接；数组则并列多个链接 */
function cell(c){
  if(Array.isArray(c))return c.map(cell).join('<span style="color:#cfc7ba;padding:0 4px">·</span>');
  if(c&&typeof c==='object'){
    const inner=esc(c.t);
    if(c.href&&/^https?:\/\//.test(c.href)){
      return `<a href="${c.href}" target="_blank" rel="noopener" style="color:var(--sc,#2f80ed);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap">${inner}</a>`;
    }
    return inner;
  }
  return esc(c);
}

/* 封面加载失败时用占位图替换（本地缺图也能保持版式美观） */
function coverFail(img){
  const d=document.createElement('div');
  d.className='cover-ph';
  d.textContent=(img.dataset.title||'').replace(/《|》/g,'');
  img.replaceWith(d);
}

function renderStage(s){
  let h=`<div class="stage-head">
    <div class="stage-dot" style="background:${s.color}">${esc(s.dot)}</div>
    <h2>${esc(s.tab)}</h2><span class="age">${esc(s.age)}</span>
  </div><p class="lead">${s.lead}</p>`;
  s.sections.forEach((sec,si)=>{
    const badge=sec.badge?`<span class="badge ${sec.badge[0]}">${esc(sec.badge[1])}</span>`:'';
    if(sec.kind==='custom'){h+=`<div class="sec">${sec.title?`<h3>${esc(sec.title)}${badge}</h3>`:''}${sec.html}</div>`}
    else if(sec.kind==='table'){
      h+=`<div class="sec" style="--sc:${sec.sc||s.color}"><h3>${esc(sec.title)}${badge}</h3>
        <div class="table-wrap"><table><tr>${sec.headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>
        ${sec.rows.map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}
        </table></div>${sec.note?`<p style="font-size:13px;color:var(--ink2);margin-top:10px">${esc(sec.note)}</p>`:''}</div>`;
    }
    else if(sec.kind==='list'||sec.kind==='warn'){
      h+=`<div class="sec" style="--sc:${s.color}"><h3>${esc(sec.title)}${badge}</h3>
        <ul class="items ${sec.kind==='warn'?'warn-list':''}">${sec.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`;
    }
    else if(sec.kind==='checklist'){
      const done=sec.items.filter((_,i)=>progress[s.id+'_'+i]).length;
      h+=`<div class="sec" style="--sc:${s.color}"><h3>${esc(sec.title)}${badge}</h3>
        <div class="mini-progress" id="mp-${s.id}">已掌握 <b>${done}</b> / ${sec.items.length}</div>
        <div style="display:flex;flex-direction:column;gap:9px">
        ${sec.items.map((it,i)=>{
          const id=s.id+'_'+i, on=progress[id]?' done':'';
          return `<label class="check${on}" data-id="${id}">
            <input type="checkbox" ${progress[id]?'checked':''}>
            <span class="box"><svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 7"/></svg></span>
            <span class="txt">${esc(it.t)}</span></label>`;
        }).join('')}</div></div>`;
    }
    else if(sec.kind==='box'){
      h+=`<div class="sec box-callout"><h3>${esc(sec.title)}${badge}</h3>
        <ul>${sec.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`;
    }
    else if(sec.kind==='books'){
      h+=`<div class="sec" style="--sc:${s.color}"><h3>${esc(sec.title)}${badge}</h3>
        <div class="book-grid">${sec.books.map(b=>`
          <div class="book">
            <div class="cov"><img src="covers/${esc(b.slug)}.jpg" data-title="${esc(b.title)}" alt="${esc(b.title)}封面" loading="lazy" onerror="coverFail(this)"></div>
            <div class="info">
              <h4>${esc(b.title)}</h4>
              ${b.author?`<div class="meta">${esc(b.author)}</div>`:''}
              <div class="intro">${esc(b.intro)}</div>
              ${b.fit?`<span class="fit">适合：${esc(b.fit)}</span>`:''}
              ${b.buy&&/^https?:\/\//.test(b.buy)?`<a class="buy" href="${esc(b.buy)}" target="_blank" rel="noopener">🛒 购买</a>`:''}
            </div>
          </div>`).join('')}</div>
        ${sec.note?`<p style="font-size:13px;color:var(--ink2);margin-top:12px">${esc(sec.note)}</p>`:''}</div>`;
    }
    else if(sec.kind==='examples'){
      h+=`<div class="sec" style="--sc:${sec.sc||s.color}"><h3>${esc(sec.title)}${badge}</h3>
        ${sec.intro?`<p class="ex-intro">${esc(sec.intro)}</p>`:''}
        ${sec.items.map(it=>`
        <div class="ex-item"><h4>${esc(it.name)}<span class="ex-point">${esc(it.point)}</span></h4>
        ${it.ex.map((e,i)=>`
          <div class="ex-q"><b>题 ${i+1}</b>${esc(e.q)}</div>
          <div class="ex-use">用法：${esc(e.use)}</div>
          <details class="ex-ans"><summary>查看答案</summary><div class="ans-body">${esc(e.ans)}</div></details>`).join('')}
        </div>`).join('')}</div>`;
    }
    else if(sec.kind==='pitfalls'){
      h+=`<div class="sec"><h3>${esc(sec.title)}${badge}</h3>
        <div class="filters" id="pfFilters">
          <button class="fbtn active" data-f="all">全部</button>
          ${Object.keys(PITFALL_LABEL).map(k=>`<button class="fbtn" data-f="${k}">${PITFALL_LABEL[k]}</button>`).join('')}
        </div>
        <input class="search" id="pfSearch" placeholder="搜索易错点，如：验根、定义域、口诀……">
        <div id="pfList" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="no-result" id="pfEmpty">没有匹配的易错点，换个关键词试试。</div>
      </div>`;
    }
  });
  return h;
}

/* 附录 B 渲染与交互 */
function renderPitfalls(filter,query){
  const list=document.getElementById('pfList'); if(!list)return;
  const empty=document.getElementById('pfEmpty');
  let any=false;
  list.innerHTML=PITFALLS.map(([id,label,text])=>{
    const show=(filter==='all'||id===filter)&&(!query||text.includes(query)||label.includes(query));
    if(!show)return '';
    any=true;
    let html=esc(text);
    if(query){html=html.split(esc(query)).join(`<mark>${esc(query)}</mark>`)}
    const color=(STAGES.find(s=>s.id===id)||{}).color||'#888';
    return `<div class="items pitfall show" style="--sc:${color};align-items:center;background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:9px 13px">
      <span class="badge" style="background:${color};flex:none">${esc(label)}</span>
      <span style="font-size:14.5px">${html}</span></div>`;
  }).join('');
  empty.style.display=any?'none':'block';
}
document.addEventListener('click',e=>{
  const f=e.target.closest('.fbtn');
  if(f&&f.parentElement.id==='pfFilters'){
    f.parentElement.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
    f.classList.add('active');
    renderPitfalls(f.dataset.f,document.getElementById('pfSearch').value.trim());
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='pfSearch'){
    const act=document.querySelector('#pfFilters .fbtn.active');
    renderPitfalls(act?act.dataset.f:'all',e.target.value.trim());
  }
});

/* 素养阶梯 */
const stairs=document.getElementById('stairs');
if(stairs){
  const steps=[
    ['kg','幼儿园','兴趣 · 数感萌芽',64],['p12','小学低','数感 · 运算能力',78],
    ['p34','小学中','符号意识 · 几何直观',92],['p56','小学高','推理意识 · 模型意识',106],
    ['mid','初中','推理能力 · 抽象能力',120],['high','高中','数学抽象 · 逻辑推理',134],
  ];
  stairs.innerHTML=steps.map(([id,name,kw,h])=>{
    const c=(STAGES.find(s=>s.id===id)||{}).color||'#999';
    return `<button class="step" style="background:${c};height:${h}px" data-go="${id}">
      <span class="t">${name}</span><span class="k">${kw}</span></button>`;
  }).join('');
  stairs.addEventListener('click',e=>{
    const b=e.target.closest('.step'); if(b)activate(b.dataset.go);
  });
}

/* 打卡 */
function updatePbar(){
  let total=0,done=0;
  STAGES.forEach(s=>{
    s.sections.forEach(sec=>{
      if(sec.kind==='checklist'){sec.items.forEach((_,i)=>{
        total++; if(progress[s.id+'_'+i])done++;
      })}
    })
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pbarFill').style.width=pct+'%';
  document.getElementById('pbarText').textContent=`${done} / ${total}`;
  document.getElementById('pbarPct').textContent=pct+'%';
}
document.addEventListener('change',e=>{
  const c=e.target.closest('.check');
  if(c){const id=c.dataset.id; progress[id]=e.target.checked; if(!e.target.checked)delete progress[id];
    save(); c.classList.toggle('done',e.target.checked);
    const sid=id.split('_')[0];
    const sec=STAGES.find(s=>s.id===sid).sections.find(x=>x.kind==='checklist');
    const d=sec.items.filter((_,i)=>progress[sid+'_'+i]).length;
    const mp=document.getElementById('mp-'+sid);
    if(mp)mp.innerHTML=`已掌握 <b>${d}</b> / ${sec.items.length}`;
    updatePbar();
  }
});
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('确定清除所有打卡记录吗？')){progress={};save();
    document.querySelectorAll('.check').forEach(c=>{c.classList.remove('done');c.querySelector('input').checked=false});
    document.querySelectorAll('[id^="mp-"]').forEach(el=>el.innerHTML=el.innerHTML.replace(/<b>\d+<\/b>/,'<b>0</b>'));
    updatePbar();
  }
};

/* 激活面板 */
function activate(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
  history.replaceState(null,'','#'+id);
  window.scrollTo({top:document.querySelector('.tabs').offsetTop,behavior:'smooth'});
}

/* 返回顶部 */
const backTop=document.getElementById('backTop');
window.addEventListener('scroll',()=>backTop.classList.toggle('show',scrollY>500));
backTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

/* 初始化 */
activate(location.hash?location.hash.slice(1):'overview');
renderPitfalls('all','');
updatePbar();
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const ids=STAGES.map(s=>s.id);
  const cur=ids.findIndex(id=>document.getElementById('panel-'+id).classList.contains('active'));
  if(e.key==='ArrowRight'&&cur<ids.length-1)activate(ids[cur+1]);
  if(e.key==='ArrowLeft'&&cur>0)activate(ids[cur-1]);
});
</script>
